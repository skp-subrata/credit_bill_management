{% extends "base.html" %}

{% block title %}Admin Portal - Credit Bill Management{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="glass-card p-8 shadow-2xl border-t-4 border-indigo-600 relative overflow-hidden">
        
        <!-- Admin Badge -->
        <div class="absolute -right-12 -top-12 w-28 h-28 bg-indigo-600/10 rounded-full flex items-end justify-start p-4">
            <span class="text-xs font-black uppercase tracking-widest text-indigo-600 dark:text-indigo-400">ADMIN</span>
        </div>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/10 text-indigo-600 dark:text-indigo-400 text-2xl mb-3 shadow-inner">
                🛡️
            </div>
            <h2 class="text-2xl font-extrabold text-slate-800 dark:text-slate-100">Admin Authentication</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Secure portal for system administrators & managers</p>
        </div>

        <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-5">
            <div>
                <label for="username" class="form-label">Administrator Username</label>
                <input type="text" id="username" name="username" required placeholder="admin" class="form-input">
            </div>

            <div>
                <label for="password" class="form-label">Administrator Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" class="form-input">
            </div>

            <button type="submit" class="btn-primary w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700">
                Access Admin Dashboard &rarr;
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400 border-t border-slate-200/50 dark:border-slate-800/50 pt-4">
            Standard user? <a href="{{ url_for('login') }}" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">User Login</a>
        </div>
    </div>
</div>
{% endblock %}
