{% extends "base.html" %}

{% block title %}Register - Credit Bill Management{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="glass-card p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Create Account</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Sign up to keep track of your credit cards & dues</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
            <div>
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" id="full_name" name="full_name" required placeholder="John Doe" class="form-input">
            </div>

            <div>
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" required placeholder="johndoe" class="form-input">
            </div>

            <div>
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" class="form-input">
            </div>

            <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" class="form-input">
            </div>

            <button type="submit" class="btn-primary w-full py-3 mt-2">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 dark:text-slate-400">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
